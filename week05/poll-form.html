<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poll Form Activity</title>
    <link rel="stylesheet" href="styles/poll-form.css">
</head>

<body>
    <form>
        <div class="form-item column2">
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" required>
        </div>

        <div class="form-item column2">
            <label for="useremail">E-Mail:</label>
            <input type="email" id="useremail" name="useremail" required>
        </div>

        <div class="form-item column1">
            <label for="favbrowser"> Select Favorite Browser</label>
            <select name="favbrowser" id="favbrowser">
                <option value="1">Microsoft Edge</option>
                <option value="2">Google Chrome</option>
                <option value="3">Mozila Firefox</option>
                <option value="4">Apple Safari</option>
                <option value="5">Other</option>
            </select>
        </div>

        <div class="form-item column1">
            <label for="pet">Do you have a household pet?</label>
            <input type="checkbox" id="pet" name="pet">
        </div>

        <div class="form-item">
            <label for="feedback">List the places you have lived:</label>
            <textarea id="feedback" name="feedback" rows="4"
              placeholder="Sao Paulo, Salvador, Maceió, Aracaju"></textarea>
        </div>

        <button type="submit">Submit Poll</button>
    </form>
</body>

</html>
