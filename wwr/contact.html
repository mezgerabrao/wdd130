<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - White Water Rafting Splash</title>
    <meta name="description"
      content="Contact Splash White Water Rafting for reservations, general inquiries, or website suggestions. Find our address, phone, email, and team.">
    <meta name="author" content="Mezger Lopes Abrão e Silva">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.png" alt="White Water Rafting Splash Logo.">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <!-- Company Information -->
        <section class="contact-info">
            <h1>Contact Us</h1>
            <p>White Water Rafting Company</p>
            <p>123 Main River Street</p>
            <p>Kolob, California</p>
            <p>+1 999 999 9999</p>
            <p><a href="mailto:email@exemplo.com">Enviar E-mail</a>
            </p>
        </section>

        <!-- Map + Form Layout -->
        <section class="contact-layout">

            <!-- Embedded Google Map -->
            <div class="contact-map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m16!1m12!1m3!1d10491.992256895406!2d-109.57597296169777!3d38.57321612089198!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!2m1!1sUtah%20white%20water%20rafting!5e0!3m2!1spt-BR!2sbr!4v1775345226226!5m2!1spt-BR!2sbr"
                  allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade">
                </iframe>
            </div>

            <!-- Contact Form -->
            <form action="#" method="post" class="contact-form">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Your full name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="your@email.com"
                      required>
                </div>

                <div class="form-group">
                    <label>Message Purpose</label>
                    <div class="radio-group">
                        <label class="radio-label" for="purpose-general">
                            <input type="radio" id="purpose-general" name="purpose" value="general"
                              checked>
                            General Inquiry
                        </label>
                        <label class="radio-label" for="purpose-reservation">
                            <input type="radio" id="purpose-reservation" name="purpose"
                              value="reservation">
                            Reservation Question
                        </label>
                        <label class="radio-label" for="purpose-suggestion">
                            <input type="radio" id="purpose-suggestion" name="purpose"
                              value="suggestion">
                            Website Suggestion
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" placeholder="Type here" rows="5"
                      required></textarea>
                </div>

                <div class="form-group checkbox-group">
                    <label class="checkbox-label" for="newsletter">
                        <input type="checkbox" id="newsletter" name="newsletter">
                        Please subscribe me to the monthly newsletter
                    </label>
                </div>

                <button type="submit" class="submit-btn">Get in Touch!</button>
            </form>

        </section>

        <!-- Employee Profiles -->
        <section class="employees">
            <h2>We Are Here to Serve You</h2>
            <div class="employee-grid">

                <figure class="employee-card">
                    <img src="images/employee1.jpg" alt="Sarah Johnson - Head Guide">
                    <figcaption>
                        <strong>Sarah Johnson</strong>
                        <span>Head River Guide</span>
                    </figcaption>
                </figure>

                <figure class="employee-card">
                    <img src="images/employee2.jpg" alt="Marcus Rivera - Safety Officer">
                    <figcaption>
                        <strong>Marcus Rivera</strong>
                        <span>Safety Officer</span>
                    </figcaption>
                </figure>

                <figure class="employee-card">
                    <img src="images/employee3.jpg" alt="Diane Cho - Reservations Manager">
                    <figcaption>
                        <strong>Diane Cho</strong>
                        <span>Reservations Manager</span>
                    </figcaption>
                </figure>

            </div>
        </section>

    </main>

    <footer>
        <p>©️2026 ✌️ Splash White Water Rafting ✌️ Mezger Abrão</p>

        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook-square.svg" alt="Facebook">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin-square.svg" alt="LinkedIn">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram-square.svg" alt="Instagram">
            </a>
        </nav>
    </footer>
</body>

</html>
